plugins {
    id 'pmd'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
}

apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
compileJava.options.encoding = "UTF-8"

apply from: '../opensha/build-git.gradle'

// Build-time git provenance rides in the fatjar as build.* (opensha's, via opensha-all.jar)
// and nzshm-build.* (this project's) root resources, read back at runtime by
// org.opensha.commons.util.GitVersion. They are the only provenance mechanism that works in
// a deployed container, which carries the jar but no git checkout; when they are absent
// GitVersion silently falls back to shelling out to git against a source tree that isn't
// there. writeBuildFiles (../opensha/build-git.gradle) only warns when git fails, and that
// warning went unread for two months after the Gradle 9 upgrade. So fail the build instead
// of producing a jar with no provenance.
//
// gitbranch is deliberately best-effort: actions/checkout leaves a detached HEAD, so it may
// resolve to a tag or remote-ref label. The commit hash is the authoritative field.
ext.requiredProvenance = ['githash', 'gitremoteurl', 'date']
ext.optionalProvenance = ['gitbranch']

/** Trimmed contents of a zip entry, or "" if the entry is absent or blank. */
ext.zipEntryText = { java.util.zip.ZipFile zip, String name ->
    def entry = zip.getEntry(name)
    entry == null ? "" : zip.getInputStream(entry).getText('UTF-8').trim()
}

/** Fails unless jarFile carries a non-empty <prefix>.<field> entry for every prefix given. */
ext.checkJarProvenance = { File jarFile, List<String> prefixes ->
    def missing = []
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        prefixes.each { prefix ->
            requiredProvenance.each { field ->
                def value = zipEntryText(zip, "${prefix}.${field}")
                if (value.isEmpty()) {
                    missing << "${prefix}.${field}"
                } else {
                    logger.lifecycle("provenance ok: ${prefix}.${field} = ${value.readLines().first()}")
                }
            }
            optionalProvenance.each { field ->
                def value = zipEntryText(zip, "${prefix}.${field}")
                if (value.isEmpty()) {
                    logger.warn("provenance: ${prefix}.${field} missing or empty in ${jarFile.name}")
                } else {
                    logger.lifecycle("provenance ok: ${prefix}.${field} = ${value.readLines().first()}")
                }
            }
        }
    }
    if (!missing.isEmpty()) {
        throw new GradleException("${jarFile.name} is missing git provenance: ${missing.join(', ')}")
    }
}

/** Removes the loose <prefix>.* files writeBuildFiles produced; they belong only in the jar. */
ext.deleteProvenanceFiles = { File dir, String prefix ->
    (requiredProvenance + optionalProvenance).each { field ->
        delete new File(dir, "${prefix}.${field}")
    }
}

/** Same contract, against the loose files writeBuildFiles has just produced in dir. */
ext.checkLooseProvenance = { File dir, String prefix ->
    def blank = { field ->
        def f = new File(dir, "${prefix}.${field}")
        !f.isFile() || f.text.trim().isEmpty()
    }
    optionalProvenance.findAll(blank).each { field ->
        logger.warn("provenance: ${prefix}.${field} not written in ${dir}")
    }
    def missing = requiredProvenance.findAll(blank)
    if (!missing.isEmpty()) {
        throw new GradleException("git provenance unavailable in ${dir}: "
                + missing.collect { "${prefix}.${it}" }.join(', ')
                + " not written - see the git warnings above")
    }
}

dependencies {
    implementation 'org.apache.sis.core:sis-referencing:1.4'
    implementation 'org.apache.sis.non-free:sis-embedded-data:1.4'
    implementation 'org.apache.sis.non-free:sis-epsg:1.4'
    /* no remote repo */
    implementation files('python/share/py4j/py4j0.10.9.1.jar', //Py4j jar installed locally  via `pip install py4j`
            'lib/openmap.jar')
    implementation project(path: ':opensha')

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.5.13'
    implementation 'org.apache.parquet:parquet-avro:1.15.1'

    implementation("org.apache.hadoop:hadoop-common:3.4.1") {
        exclude group: 'org.apache.curator', module: 'curator-recipes'
        exclude group: 'org.apache.kerby', module: 'kerb-core'
        exclude group: 'org.apache.avro', module: 'avro'
        exclude group: 'org.apache.curator', module: 'curator-client'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
        exclude group: 'org.apache.kerby', module: 'kerb-simplekdc'
        exclude group: 'org.apache.hadoop', module: 'hadoop-annotations'
        exclude group: 'org.apache.hadoop.thirdparty', module: 'hadoop-shaded-protobuf_3_7'
        exclude group: 'org.apache.commons', module: 'commons-text'
        exclude group: 'org.apache.commons', module: 'commons-math3'
        exclude group: 'org.apache.commons', module: 'commons-lang3'
        exclude group: 'org.apache.zookeeper', module: 'zookeeper'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'org.eclipse.jetty', module: 'jetty-server'
        exclude group: 'org.eclipse.jetty', module: 'jetty-servlet'
        exclude group: 'org.eclipse.jetty', module: 'jetty-webapp'
        exclude group: 'org.eclipse.jetty', module: 'jetty-util'
        exclude group: 'javax.servlet', module: 'javax.servlet-api'
        exclude group: 'javax.servlet.jsp', module: 'jsp-api'
        exclude group: 'com.sun.jersey', module: 'jersey-json'
        exclude group: 'com.sun.jersey', module: 'jersey-core'
        exclude group: 'com.sun.jersey', module: 'jersey-servlet'
        exclude group: 'com.sun.jersey', module: 'jersey-server'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'commons-beanutils', module: 'commons-beanutils'
        exclude group: 'commons-codec', module: 'commons-codec'
        exclude group: 'commons-io', module: 'commons-io'
        exclude group: 'commons-net', module: 'commons-net'
        exclude group: 'commons-cli', module: 'commons-cli'
        exclude group: 'commons-pool', module: 'commons-pool'
        exclude group: 'ch.qos.reload4j', module: 'reload4j'
        exclude group: 'org.slf4j', module: 'slf4j-reload4j'
        exclude group: 'com.jcraft', module: 'jsch'
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'dnsjava', module: 'dnsjava'
        exclude group: 'log4j', module: 'log4j'
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://code.usgs.gov/api/v4/groups/1352/-/packages/maven"
        name = "NSHMP GitLab Group"
    }
}

configurations {
    apiResolvable {
        description = 'resolvable extension of the api classpath'
        canBeResolved = true
        extendsFrom api
    }
}

jar {
    into 'resources', {
        from 'src/main/java/resources'
    }
}

sourceSets {

    intTest {
        java {
            srcDirs = ['src/integration/java']
        }

        resources {
            srcDirs = ['src/integration/resources']
        }
    }

    smokeTest {
        java {
            srcDirs = ['src/smokeTest/java']
        }
    }
}

configurations {
    intTestImplementation.extendsFrom implementation
    intTestRuntimeOnly.extendsFrom runtimeOnly
    smokeTestImplementation.extendsFrom implementation
    smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    intTestImplementation sourceSets.main.output
    intTestImplementation 'junit:junit:4.12'
    intTestImplementation 'com.google.jimfs:jimfs:1.1'
    smokeTestImplementation sourceSets.main.output
    smokeTestImplementation 'junit:junit:4.12'
}

task fatJar(type: Jar, dependsOn: ':opensha:fatJar') {

    doFirst { ->
        // Fail before the archive is built if either half of the provenance is missing.
        // nzshm-build.* is written right here; build.* rides in on opensha-all.jar, which is
        // the only place to look for it since :opensha:fatJar deletes its loose copies.
        writeBuildFiles("/nzshm-build")
        try {
            checkLooseProvenance(projectDir, "nzshm-build")
            checkJarProvenance(file('../opensha/build/libs/opensha-all.jar'), ['build'])
        } catch (Exception e) {
            // Failing here means the doLast cleanup never runs, so tidy up before rethrowing
            // rather than leaving a partial set of nzshm-build.* files in the project root.
            deleteProvenanceFiles(projectDir, "nzshm-build")
            throw e
        }
    }
    doLast {
        deleteProvenanceFiles(projectDir, "nzshm-build")
    }
    doLast {
        // Belt and braces: the loose files existing does not prove they were packaged.
        checkJarProvenance(archiveFile.get().asFile, ['build', 'nzshm-build'])
    }

    archiveBaseName = project.name + '-all'
    from {
        configurations.apiResolvable.collect { it.isDirectory() ? it : zipTree(it).matching {
                exclude { it.path.contains('META-INF') }
        }}
    }
    from(project.projectDir) {
        include 'nzshm-build.githash'
        include 'nzshm-build.gitbranch'
        include 'nzshm-build.gitremoteurl'
        include 'nzshm-build.date'
    }

    // include compiled source from this project
    from sourceSets.main.allJava
    // include upstream project fat jar
    from zipTree(file('../opensha/build/libs/opensha-all.jar'))
    from zipTree(file('python/share/py4j/py4j0.10.9.1.jar'))

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll {
            it.name.contains('parquet')
                    || it.name.contains('avro')
                    || it.name.contains('jackson')
                    || it.name.contains('hadoop')
                    || it.name.contains('woodstox')
                    || it.name.contains('stax2')
                    || it.name.contains('commons')
        }
                .collect { zipTree(it) }
    }

    duplicatesStrategy = 'exclude'
    //  from sourceSets.main.allJava
    with jar
}

task integrationTest(type: Test) {
    description = 'Runs integration tests.'
    group = 'verification'

    testClassesDirs = sourceSets.intTest.output.classesDirs
    classpath = sourceSets.intTest.runtimeClasspath

    shouldRunAfter test
}

check.dependsOn integrationTest

task smokeTest(type: Test) {
    description = 'Runs Smoke Tests.'
    group = 'verification'

    testClassesDirs = sourceSets.smokeTest.output.classesDirs
    classpath = sourceSets.smokeTest.runtimeClasspath

    shouldRunAfter test
}

task pmd(type: GradleBuild) {
    tasks = ['pmdMain', 'pmdTest', 'pmdIntTest', 'pmdSmokeTest']
}

test {
    // exclude expensive opensha tests unless flag is set on command line
    if (!providers.gradleProperty("openshaTest").isPresent()) {
        project.gradle.startParameter.excludedTaskNames.add("opensha:test")
    }
    filter {
        includeTestsMatching('*NZSHM22.*')
        includeTestsMatching('*nz.cri.gns.*')
        includeTestsMatching('*UCERF3.inversion.*')
    }

    //filter { excludeTestsMatching 'generic.*' }
    // excludes a whole package, "generic". NB this is not a regex:
    // '*' is simply "wildcard" and dot means dot ... other more
    // sophisticated "ANT-style" patterns are available in class Test

    //filter { excludeTestsMatching '*_FT' }
    // also exclude all test classes ending in "_FT" (e.g. for "functional test")
}

// PMD enforces Java best practices https://docs.pmd-code.org/latest/pmd_rules_java.html
pmd {
    // We have hundreds of failures at the moment. Set this to false once it's fixed.
    ignoreFailures = true
}

// spotless enforces Java style rules.
spotless {
    java {
        removeUnusedImports()
        // apply AOSP code style https://source.android.com/docs/setup/contribute/code-style
        googleJavaFormat("1.18.1").aosp()
    }
}

// jacoco generates coverage reports
jacocoTestReport {
    reports {
        // XML is require for the github action
        xml.required = true
    }
}


