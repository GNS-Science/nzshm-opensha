plugins {
    id 'pmd'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'jacoco'
    id 'pl.allegro.tech.build.axion-release' version '1.18.18'
}

// Versioning lives in git tags; see "Releases" in README.md. The prefix keeps semver releases
// (release/v1.2.3) apart from the free-text release/<name> tags this project used before 2026,
// which axion must not try to parse as versions.
scmVersion {
    tag {
        prefix = 'release/v'
        versionSeparator = ''
    }
    versionIncrementer 'incrementPatch'
    hooks {
        pre { context ->
            promoteChangelog(context.currentVersion, context.previousVersion)
            context.addCommitPattern('changelog.md')
        }
        pre 'commit'
    }
}

version = scmVersion.version

/**
 * Closes off the "## TBD" section of changelog.md as the released version and opens a fresh empty
 * one. Run from the axion pre-release hook, so the rewrite is committed before the tag is created
 * and the tag therefore points at a changelog that names it.
 *
 * Also enforces the versioning policy: a section carrying a `behaviour change` marker is a major
 * release, because the same inputs stop producing the same outputs.
 */
def promoteChangelog(String releaseVersion, String previousVersion) {
    def changelog = file('changelog.md')
    def heading = ~/(?m)^## TBD$/
    def text = changelog.text
    if (!(text =~ heading)) {
        throw new GradleException("changelog.md has no '## TBD' section to release as ${releaseVersion}")
    }

    // Everything from the TBD heading up to the next '## ' heading, or to the end of the file.
    def pending = (text =~ /(?ms)^## TBD$(.*?)(?=^## |\z)/)[0][1]
    if (pending.trim().isEmpty()) {
        throw new GradleException("changelog.md's '## TBD' section is empty; nothing to release as ${releaseVersion}")
    }

    def majorOf = { String v -> v.tokenize('.')[0] as int }
    if (pending.contains('behaviour change')
            && majorOf(previousVersion) >= 1
            && majorOf(releaseVersion) == majorOf(previousVersion)) {
        throw new GradleException("changelog.md lists a behaviour change, which is a major release, but "
                + "${releaseVersion} only bumps minor/patch over ${previousVersion}. Re-run with "
                + "-Prelease.forceVersion=${majorOf(previousVersion) + 1}.0.0")
    }

    def released = "## TBD\n\n## [${releaseVersion}] - ${java.time.LocalDate.now()}"
    changelog.text = text.replaceFirst(heading, released)
    logger.lifecycle("changelog.md: released '## TBD' as ${releaseVersion}")
}

apply plugin: 'java-library'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
compileJava.options.encoding = "UTF-8"

apply from: '../opensha/build-git.gradle'

// Build-time git provenance rides in the fatjar as build.* (opensha's, via opensha-all.jar)
// and nzshm-build.* (this project's) root resources, read back at runtime by
// org.opensha.commons.util.GitVersion. They are the only provenance mechanism that works in
// a deployed container, which carries the jar but no git checkout; when they are absent
// GitVersion silently falls back to shelling out to git against a source tree that isn't
// there. writeBuildFiles (../opensha/build-git.gradle) only warns when git fails, and that
// warning went unread for two months after the Gradle 9 upgrade. So fail the build instead
// of producing a jar with no provenance.
//
// gitbranch is deliberately best-effort: actions/checkout leaves a detached HEAD, so it may
// resolve to a tag or remote-ref label. The commit hash is the authoritative field.
ext.requiredProvenance = ['githash', 'gitremoteurl', 'date']
ext.optionalProvenance = ['gitbranch']

/** Trimmed contents of a zip entry, or "" if the entry is absent or blank. */
ext.zipEntryText = { java.util.zip.ZipFile zip, String name ->
    def entry = zip.getEntry(name)
    entry == null ? "" : zip.getInputStream(entry).getText('UTF-8').trim()
}

/** Fails unless jarFile carries a non-empty <prefix>.<field> entry for every prefix given. */
ext.checkJarProvenance = { File jarFile, List<String> prefixes ->
    def missing = []
    new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
        prefixes.each { prefix ->
            requiredProvenance.each { field ->
                def value = zipEntryText(zip, "${prefix}.${field}")
                if (value.isEmpty()) {
                    missing << "${prefix}.${field}"
                } else {
                    logger.lifecycle("provenance ok: ${prefix}.${field} = ${value.readLines().first()}")
                }
            }
            optionalProvenance.each { field ->
                def value = zipEntryText(zip, "${prefix}.${field}")
                if (value.isEmpty()) {
                    logger.warn("provenance: ${prefix}.${field} missing or empty in ${jarFile.name}")
                } else {
                    logger.lifecycle("provenance ok: ${prefix}.${field} = ${value.readLines().first()}")
                }
            }
        }
    }
    if (!missing.isEmpty()) {
        throw new GradleException("${jarFile.name} is missing git provenance: ${missing.join(', ')}")
    }
}

/** Removes the loose <prefix>.* files writeBuildFiles produced; they belong only in the jar. */
ext.deleteProvenanceFiles = { File dir, String prefix ->
    (requiredProvenance + optionalProvenance).each { field ->
        delete new File(dir, "${prefix}.${field}")
    }
}

