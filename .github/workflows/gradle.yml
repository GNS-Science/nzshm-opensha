# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:
    branches: [ master ]
#  schedule:
#    - cron: '20 15 * * 0'

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:

    - name: Clone opensha fork
      if: github.event_name != 'schedule'
      uses: actions/checkout@v7
      with:
        repository: GNS-Science/opensha
        ref: fix/rup-normalization-2024
        path: opensha

    # scheduled build: each week, we want to build against the latest upstream to catch drifts early
    - name: Clone opensha
      if: github.event_name == 'schedule'
      uses: actions/checkout@v7
      with:
        repository: opensha/opensha
        ref: master
        path: opensha

    - uses: actions/checkout@v7
      with:
        path: main

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        cd main
        chmod +x gradlew
        ./gradlew check
        ./gradlew jacocoTestReport

    #----------------------------------------------
    #       upload coverage report to Codecov
    #----------------------------------------------
    - name: Submit coverage report
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

    # Semver releases are tagged release/v1.2.3 by `./gradlew release`; the leading "v" is dropped
    # from the version so the jar is named after the version alone. Free-text release/<name> tags
    # predating the semver policy still work, they just skip the changelog check below.
    - name: Set version env var
      if: startsWith(github.ref, 'refs/tags/release')
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/release/}
        echo "TAG_VERSION=${TAG_VERSION#v}" >> $GITHUB_ENV

    - name: Set fatjar name
      if: startsWith(github.ref, 'refs/tags/release')
      run: echo "JAR_NAME=nzshm-opensha-all-${{env.TAG_VERSION}}.jar" >> $GITHUB_ENV

    # The tag is what users cite, so it must name a changelog section that says what changed in it.
    - name: Extract changelog section
      if: startsWith(github.ref, 'refs/tags/release/v')
      run: |
        cd main
        awk -v version="## [${{env.TAG_VERSION}}]" '
          index($0, version) == 1 { found = 1; next }
          found && /^## / { exit }
          found { print }
        ' changelog.md > "$RUNNER_TEMP/release-notes.md"
        if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
          echo "changelog.md has no '## [${{env.TAG_VERSION}}]' section" >&2
          exit 1
        fi
        cat "$RUNNER_TEMP/release-notes.md"

    - name: Build FatJar with Gradle
      if: startsWith(github.ref, 'refs/tags/release')
      run: |
        cd opensha
        git rev-parse HEAD > ../main/src/main/resources/opensha-ref.txt
        cd ../main
        echo "${{env.TAG_VERSION}}" > src/main/resources/tagged-version.txt
        chmod +x gradlew
        ./gradlew fatjar
        mv build/libs/nzshm-opensha-all.jar build/libs/${{env.JAR_NAME}}

    - uses: GNS-Science/s3-sync-action@master
      with:
        args: --acl public-read
      if: startsWith(github.ref, 'refs/tags/release')
      name: Upload to S3
      id: S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_AWS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_AWS_SECRET_ACCESS_KEY}}
        AWS_S3_BUCKET: ${{ secrets.RELEASE_AWS_BUCKET }}
        AWS_REGION: 'ap-southeast-2'
        SOURCE_DIR: main/build/libs/
        destination_dir: ''

    # Notes only: the jar itself lives in S3, this just gives the tag a readable summary.
    - name: Create GitHub release
      if: startsWith(github.ref, 'refs/tags/release/v')
      run: |
        cd main
        gh release create "${GITHUB_REF#refs/tags/}" \
          --title "${{env.TAG_VERSION}}" \
          --notes-file "$RUNNER_TEMP/release-notes.md"
      env:
        GH_TOKEN: ${{ github.token }}

    #----------------------------------------------
    #       Post error msg to Slack for failed scheduled builds
    #----------------------------------------------
    - name: Post a Slack message if build failed
      uses: slackapi/slack-github-action@v2.0.0
      if: failure() && github.event_name == 'schedule'
      with:
        webhook: ${{ secrets.SCHEDULED_GITHUB_SLACK_WEBHOOK }}
        webhook-type: incoming-webhook
        payload: |
          text: "⚠️*${{ github.event.repository.name }}: ${{ job.status }}*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }}>"
